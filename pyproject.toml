[project]
name = "tyk"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 79
skip = [".venv", "alembic/versions"]
known_first_party = ["src"]

[tool.flake8]
max-line-length = 79
max-complexity = 10
exclude = [".venv", "alembic/versions"]
docstring-convention = "google"
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
select = ["E", "W", "F", "C", "B", "D", "N", "Q", "ERA", "S"]
ignore = ["W503", "D100", "D104", "D107"]
per-file-ignores = [
    "tests/*: S101",
    "scripts/run_mypy.py: S404, S603, S607"
]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_generics = true
disallow_subclassing_any = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "flake8-bandit>=4.1.1",
    "flake8-bugbear>=25.11.29",
    "flake8-docstrings>=1.7.0",
    "flake8-eradicate>=1.5.0",
    "flake8-pyproject>=1.2.4",
    "flake8-quotes>=3.4.0",
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "pep8-naming>=0.15.1",
    "pre-commit>=4.6.0",
]
